<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game Hub</title>
  <meta name="theme-color" content="#0B0D12">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0D12; color: #E9EDF5; font: 600 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    header { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 4px) max(10px, env(safe-area-inset-right)) 4px max(10px, env(safe-area-inset-left)); background: #131722; border-bottom: 1px solid #252B3A; min-height: 44px; }
    a.back { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; margin-left: -6px; color: #E9EDF5; text-decoration: none; border-radius: 10px; }
    a.back:hover { background: #1A1F2C; }
    a.back:focus-visible, iframe:focus-visible { outline: 2px solid #22D3EE; outline-offset: -2px; }
    #title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8C95A8; }
    iframe { flex: 1; width: 100%; border: 0; background: #000; }
    .msg { margin: auto; padding: 24px; text-align: center; color: #8C95A8; }
    .msg a { color: #22D3EE; }
  </style>
</head>
<body>
  <header><a class="back" href="/">&larr; Hub</a><span id="title"></span></header>
  <script type="module">
    // In-app player for games hosted on another origin: a full-screen iframe with a back bar, so the game
    // stays inside the installed app instead of opening a browser window.
    const slug = new URLSearchParams(location.search).get('g') || '';
    const fail = (text) => { const p = document.createElement('p'); p.className = 'msg'; p.innerHTML = `${text} <a href="/">Back to Game Hub</a>`; document.body.append(p); };
    try {
      const { games = [] } = await (await fetch('/games.json', { cache: 'no-cache' })).json();
      const g = games.find((x) => x.slug === slug);
      if (!g) fail('That game is not in the hub.');
      else {
        document.title = `${g.name} · Game Hub`;
        document.getElementById('title').textContent = g.name;
        const f = document.createElement('iframe');
        f.src = g.url; f.title = g.name;
        f.allow = 'fullscreen; autoplay; gamepad; clipboard-write; screen-wake-lock';
        f.setAttribute('allowfullscreen', '');
        document.body.append(f);
        f.focus();
      }
    } catch { fail('The game list could not be loaded.'); }
  </script>
</body>
</html>
