<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game Hub</title>
  <meta name="description" content="Game Hub: free browser games by Malik. Tower defense, a roll-and-place tycoon, skateboarding and an arena shooter. Live player counts, likes and favourites.">
  <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="canonical" href="https://malikmohamedgamer-bit.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Game Hub">
  <meta property="og:title" content="Game Hub">
  <meta property="og:description" content="Free browser games with live player counts. Pick one and play: no download, no account.">
  <meta property="og:url" content="https://malikmohamedgamer-bit.github.io/">
  <meta property="og:image" content="https://malikmohamedgamer-bit.github.io/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Game Hub">
  <meta name="twitter:description" content="Free browser games with live player counts. Pick one and play.">
  <meta name="twitter:image" content="https://malikmohamedgamer-bit.github.io/og.png">
  <script>
    // Theme before first paint: the saved choice, else the system setting.
    try { var t = localStorage.getItem('hub.theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
  </script>
  <link rel="stylesheet" href="/css/hub.css">
  <link rel="modulepreload" href="/js/app.js">
</head>
<body>
  <a class="skip" href="#list">Skip to games</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/" aria-label="Game Hub home">
        <img src="/icons/favicon.svg" width="36" height="36" alt="">
        <span>Game Hub</span>
      </a>
      <p class="live" aria-live="polite"><span class="dot" aria-hidden="true"></span><b id="total-online">—</b> <span>playing now</span></p>
      <div class="top-actions">
        <button class="icon-btn" id="install" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span>Install</span>
        </button>
        <button class="icon-btn" id="theme" type="button" aria-label="Switch to light theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="ios-hint" id="ios-hint" hidden>
    <p>Install Game Hub: tap <svg viewBox="0 0 24 24" aria-label="Share" role="img"><path d="M12 15V3m0 0L8 7m4-4 4 4M6 11H5v10h14V11h-1"/></svg> <b>Share</b>, then <b>Add to Home Screen</b>.</p>
    <button class="icon-btn small" type="button" id="ios-hint-close" aria-label="Dismiss install hint">✕</button>
  </div>

  <main class="wrap">
    <div class="bar">
      <div class="tabs" role="tablist" aria-label="Lists">
        <button role="tab" type="button" id="tab-all" aria-selected="true" aria-controls="list" data-tab="all">All</button>
        <button role="tab" type="button" id="tab-favs" aria-selected="false" aria-controls="list" data-tab="favs" tabindex="-1">Favourites</button>
        <button role="tab" type="button" id="tab-recent" aria-selected="false" aria-controls="list" data-tab="recent" tabindex="-1">Recently played</button>
      </div>
      <div class="filters">
        <label class="search">
          <span class="sr">Search games</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="search" type="search" placeholder="Search games" autocomplete="off" spellcheck="false">
        </label>
        <label class="sort">
          <span class="sr">Sort by</span>
          <select id="sort">
            <option value="online">Most online</option>
            <option value="plays">Most played</option>
            <option value="rating">Top rated</option>
            <option value="newest">Newest</option>
          </select>
        </label>
      </div>
      <div class="tags" id="tags" role="group" aria-label="Filter by tag"></div>
    </div>

    <p class="status" id="status" role="status"></p>
    <ol class="list" id="list" role="tabpanel" aria-labelledby="tab-all" aria-busy="true">
      <li class="row skeleton" aria-hidden="true"><span></span><span></span><span></span></li>
      <li class="row skeleton" aria-hidden="true"><span></span><span></span><span></span></li>
      <li class="row skeleton" aria-hidden="true"><span></span><span></span><span></span></li>
      <li class="row skeleton" aria-hidden="true"><span></span><span></span><span></span></li>
    </ol>
    <p class="foot">Made by Malik. New games appear here automatically. <span id="stats-note"></span></p>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="d-name">
    <div class="detail-inner">
      <button class="icon-btn close" type="button" id="d-close" aria-label="Close">✕</button>
      <div class="banner"><img id="d-banner" alt="" width="1280" height="720"></div>
      <div class="d-head">
        <img id="d-icon" width="64" height="64" alt="">
        <div>
          <h2 id="d-name"></h2>
          <p id="d-tagline" class="tagline"></p>
        </div>
      </div>
      <div class="d-actions" id="d-actions"></div>
      <p id="d-long" class="long"></p>
      <h3>Controls</h3>
      <ul id="d-controls" class="controls"></ul>
      <dl class="facts">
        <div><dt>Platforms</dt><dd id="d-platforms"></dd></div>
        <div><dt>Last updated</dt><dd id="d-updated"></dd></div>
        <div><dt>Source</dt><dd><a id="d-repo" target="_blank" rel="noopener">GitHub</a></dd></div>
      </dl>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="status">Game Hub needs JavaScript to list the games.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
